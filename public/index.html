<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chessyyy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <h1>Chessyyy</h1>

    <div id="mode-select">
      <button id="mode-hotseat" type="button">Hot-Seat</button>
      <button id="mode-vs-computer" type="button">Vs Computer</button>
      <button id="mode-online" type="button">Online</button>
    </div>

    <div id="online-join" hidden>
      <label for="room-code-input">Room code</label>
      <input id="room-code-input" type="text" maxlength="12" placeholder="e.g. TIGER42" autocomplete="off" />
      <button id="join-room-button" type="button">Join / create</button>
      <button id="online-back-button" type="button">Back</button>
    </div>

    <div id="game" hidden>
      <div id="status-bar">
        <span id="status-text"></span>
        <button id="new-game-button" type="button">New game</button>
        <button id="menu-button" type="button">Menu</button>
      </div>
      <div id="board" role="grid" aria-label="Chess board"></div>
    </div>

    <div id="promotion-modal">
      <div class="panel">
        <p>Promote to:</p>
        <div class="choices"></div>
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
